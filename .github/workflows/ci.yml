name: glip-frontend-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release contract
        run: python scripts/verify_release_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm test
      - run: node --check server.mjs
      - run: npm run build
      - run: npm run build:evidence
      - name: Verify packaged source contract
        run: |
          rm -rf /tmp/glip-source
          mkdir -p /tmp/glip-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/glip-source
          python scripts/verify_release_contract.py --root /tmp/glip-source
      - name: Capture release provenance
        run: |
          python - <<'PY'
          import json, os, subprocess
          payload = {
              "commit_sha": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "tree_sha": subprocess.check_output(["git","rev-parse","HEAD^{tree}"], text=True).strip(),
              "github_run_id": os.getenv("GITHUB_RUN_ID"),
              "github_run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
          }
          open("RELEASE_PROVENANCE.json","w",encoding="utf-8").write(json.dumps(payload, indent=2) + "\n")
          PY
      - name: Preserve generated lock/build evidence
        uses: actions/upload-artifact@v4
        with:
          name: glip-frontend-build-evidence
          path: |
            package-lock.json
            BUILD_EVIDENCE.json
            RELEASE_PROVENANCE.json
          if-no-files-found: error
